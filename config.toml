baseURL = "https://paulb.im/"
languageCode = "en-au"
title = "Paul Behrisch"
theme = "congo"

defaultContentLanguage = "en"
enableRobotsTXT = true
summaryLength = 0

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  colorScheme = "congo"
  defaultAppearance = "light"
  autoSwitchAppearance = true
  enableSearch = false
  enableCodeCopy = true
  enableImageLazyLoading = true
  enableImageWebp = true
  enableQuicklink = true

  [params.header]
    layout = "basic"
    showTitle = true

  [params.footer]
    showAppearanceSwitcher = true
    showScrollToTop = true

  [params.homepage]
    layout = "page"
    showRecent = false

  [params.article]
    showBreadcrumbs = true
    showReadingTime = false
    showTableOfContents = false

  [params.list]
    showBreadcrumbs = false
    showTableOfContents = false

  [params.sitemap]
    excludedKinds = ["taxonomy", "term"]

  [params.author]
    name = "Paul Behrisch"
    headline = "Staff Platform Engineer"
    bio = "Sydney-based platform engineer with deep platform, cloud, and reliability experience."
    image = ""
    links = [
      { linkedin = "https://www.linkedin.com/in/behrisch/" }
    ]

[menus]
  [[menus.main]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/behrisch/"
    weight = 10
    [menus.main.params]
      target = "_blank"
      rel = "noopener"

[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    title = "Paul Behrisch"

    [languages.en.params]
      dateFormat = "2 January 2006"
      description = "Staff Platform Engineer focused on scalable infrastructure and developer enablement."

[module]
  replacements = "github.com/jpanther/congo -> themes/congo"
